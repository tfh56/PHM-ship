# ============================================================================
# ship.conf — 船舶发动机诊断预测平台部署配置（外行改这里）
# deploy.sh 与 manual_ops.sh 都读本文件；改完无需改脚本
# ============================================================================

# ---- 网络与端口 ----
ES_PORT="9200"          # Elasticsearch
KB_PORT="5601"          # Kibana
FLEET_PORT="8220"       # Fleet Server
MY_IP=""                # 留空=自动探测本机 IP

# ---- 认证 ----
ES_PASSWORD=${ES_PASSWORD:-changeme}       # 留空=自动生成随机密码（部署后看 .credentials）

# ---- 版本与资源 ----
ES_VERSION=${ES_VERSION:-""}           # 留空=自动探测最新；如锁版本填 9.5.4
ES_HEAP="700m"            # ES 堆内存：机器小改 700m，机器大改 2g

# ---- 目录 ----
INSTALL_DIR=$(realpath -m ${INSTALL_DIR:-$HOME/ship-elastic})   # 部署根目录
INGEST_DIR=""           # 数据文件目录（留空=$INSTALL_DIR/data/data-ingest）
AGENT_BASE="$HOME/ship-agents"     # Agent 安装基目录（须在 ext4 分区）

# ---- 数据 ----
GPS_LEAP_SECONDS="18"   # 设备时间已是 UTC 则改 0
ENGINE_PREFIX="engine_" # 发动机数据文件前缀
IMU_PREFIX="imu_"       # IMU/GPS 数据文件前缀

# ---- 生命周期（月）----
HOT_MONTHS="3"; WARM_MONTHS="12"; COLD_MONTHS="36"

# ---- 可选功能 ----
GLM_API_KEY=""          # LLM 诊断对话用（不用可留空）
